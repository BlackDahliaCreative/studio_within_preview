    <!-- ═══════════════════════════════════════════════════════════════════
         CLIENT CONFIG — update these placeholders before launch
         ═══════════════════════════════════════════════════════════════════
         SITE_LANG      → html lang attribute, e.g. "it" or "en"
         SITE_NAME      → brand name, e.g. "Acme Studio"
         SITE_URL       → canonical root, e.g. "https://www.acme.com"
         SITE_TAGLINE   → short description used in the default title
         SITE_DESC      → default meta description (≤160 chars)
         SITE_OG_IMAGE  → absolute URL to a 1200×630 social-share image
         GTM_ID         → Google Tag Manager container ID, e.g. "GTM-XXXXXXX"
                          Set to empty string "" to disable GTM entirely
         ═══════════════════════════════════════════════════════════════════ -->

    <!-- Favicon / PWA (Vite adds the preview base path automatically) -->
    <link rel="icon"             href="/studio_within_preview/favicon.ico" />
    <link rel="apple-touch-icon" href="/studio_within_preview/logo192.png" />
    <link rel="manifest"         href="/studio_within_preview/manifest.json" />

    <!-- Preload the font used above the fold (the menu), so it arrives with the page.     -->
    <!-- Preload only 1-2 fonts that every page uses (the "latin" file); the rest load later. -->
    <!-- Fontsource files are in node_modules/@fontsource(-variable)/<name>/files/          -->
    <link rel="preload" href="/studio_within_preview/assets/inter-latin-wght-normal-Dx4kXJAl.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Performance: preconnect to any third-party origins used site-wide -->

    <!-- <link rel="preconnect" href="https://use.typekit.net" crossorigin /> -->

    <!-- Title, description, canonical, Open Graph and Twitter tags for each page come from
         SEOHead (values in src/site.config.json). The build writes them in here: -->
    <title data-rh="true">CLIENT_NAME | CLIENT_TAGLINE</title>
    <meta data-rh="true" name="description" content="CLIENT_DESC"/><meta data-rh="true" name="robots" content="noindex, nofollow"/><meta data-rh="true" property="og:type" content="website"/><meta data-rh="true" property="og:site_name" content="CLIENT_NAME"/><meta data-rh="true" property="og:title" content="CLIENT_NAME | CLIENT_TAGLINE"/><meta data-rh="true" property="og:description" content="CLIENT_DESC"/><meta data-rh="true" property="og:url" content="https://www.CLIENT_DOMAIN.com/"/><meta data-rh="true" property="og:image" content="https://www.CLIENT_DOMAIN.com/CLIENT_OG_IMAGE_PATH"/><meta data-rh="true" property="og:image:width" content="1200"/><meta data-rh="true" property="og:image:height" content="630"/><meta data-rh="true" name="twitter:card" content="summary_large_image"/><meta data-rh="true" name="twitter:title" content="CLIENT_NAME | CLIENT_TAGLINE"/><meta data-rh="true" name="twitter:description" content="CLIENT_DESC"/><meta data-rh="true" name="twitter:image" content="https://www.CLIENT_DOMAIN.com/CLIENT_OG_IMAGE_PATH"/>
    <link data-rh="true" rel="canonical" href="https://www.CLIENT_DOMAIN.com/"/>
    

    <!-- Same on every page -->
    <meta property="og:locale"       content="en_US" />
    <meta property="og:image:alt"    content="CLIENT_NAME" />
    <meta name="twitter:image:alt"   content="CLIENT_NAME" />

    })(window,document,'script','dataLayer','GTM_ID');</script> -->
    <!-- End Google Tag Manager -->

    <!-- Organization JSON-LD — validate at: https://search.google.com/test/rich-results       -->
    <!-- CLIENT_NAME, CLIENT_URL, CLIENT_DESC and CLIENT_OG_IMAGE are filled in from             -->
    <!-- src/site.config.json at build time. Fill in the social links, or use "LocalBusiness" etc. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "CLIENT_URL/#organization",
          "name": "CLIENT_NAME",
          "url": "CLIENT_URL",
          "logo": {
            "@type": "ImageObject",
            "url": "CLIENT_OG_IMAGE",
            "width": 1200,
            "height": 630
          },
          "description": "CLIENT_DESC",
          "sameAs": [
            "https://www.instagram.com/CLIENT_INSTAGRAM",
            "https://www.facebook.com/CLIENT_FACEBOOK"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "CLIENT_URL/#website",
          "url": "CLIENT_URL",
          "name": "CLIENT_NAME",
          "publisher": { "@id": "CLIENT_URL/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
